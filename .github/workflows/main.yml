name: Run All Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      -main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: TEST SDK 
        working-directory: ./sdk
        run: go test -v -race -count=1 ./tests/...

      - name: Test SERVER BACKEND
        working-directory: ./server
        run: go test -v -race -count=1 ./tests/...
